<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140e0a" />
    <meta name="description" content="生日蛋糕、一首歌，然後把蠟燭吹熄。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="生日" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>生日</title>
    <link id="favicon" rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="scene.css" />
  </head>
  <body>
    <main class="stage">
      <div id="sheet" class="sheet">
        <img
          id="photo"
          class="photo"
          src="cake-out.jpg"
          alt="桌上的生日蛋糕，中間有一根蠟燭"
        />
        <div class="veil"></div>
        <div id="flame" class="flame-anchor" aria-hidden="true">
          <div class="flame-lean">
            <div class="flame-body">
              <div class="flame-sway">
                <i class="outer"></i>
                <i class="mid"></i>
                <i class="core"></i>
                <i class="spark s1"></i>
                <i class="spark s2"></i>
                <i class="spark s3"></i>
              </div>
            </div>
          </div>
          <div class="smoke" aria-hidden="true">
            <b class="plume"></b>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
          </div>
        </div>
        <button id="flame-hit" class="flame-hit" type="button" aria-label="輕點燭火" hidden></button>
      </div>
      <div class="caption">
        <p id="primary" class="primary"></p>
        <p id="secondary" class="secondary"></p>
        <button id="again" class="again" type="button" hidden>再點一次</button>
        <p id="debug" hidden></p>
      </div>
      <button id="start" class="start" type="button" aria-label="點一下，開始唱歌"></button>
    </main>
    <audio id="song" src="../Happy%20Birthday-v1.mp3" preload="auto"></audio>
    <script type="module" src="scene.mjs"></script>
  </body>
</html>
